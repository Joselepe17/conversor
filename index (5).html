<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor Celsius a Fahrenheit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Celsius a Fahrenheit</h1>

    <label for="grados">Grados Celsius (°C)</label>
    <input type="number" id="grados" placeholder="Por ejemplo: 25" step="any">

    <button id="boton">Convertir</button>

    <p id="resultado"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
